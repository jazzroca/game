<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI 바둑 (Baduk Master)</title>
    <style>
        :root {
            --bg-color: #1a1917;
            --panel-bg: #272523;
            --accent-gold: #e5b35c;
            --text-light: #ececec;
            --text-dim: #9e978e;
            --board-wood: #dcab6b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 12px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
            gap: 14px;
        }

        /* Top Header & Info */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.06);
        }

        .title-group h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title-group span {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-weight: 400;
        }

        .record-badge {
            font-size: 0.85rem;
            color: var(--text-dim);
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .record-badge b {
            color: #fff;
        }

        /* Dashboard & Turn Bar */
        .dashboard {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background: var(--panel-bg);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.06);
            gap: 12px;
        }

        .player-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 10px;
            transition: background 0.3s, border 0.3s;
            border: 2px solid transparent;
        }

        .player-card.active {
            background: rgba(229, 179, 92, 0.12);
            border-color: var(--accent-gold);
        }

        .player-card.right {
            flex-direction: row-reverse;
            text-align: right;
        }

        .stone-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }

        .stone-black-icon {
            background: radial-gradient(circle at 35% 35%, #555, #111 80%);
            border: 1px solid #444;
        }

        .stone-white-icon {
            background: radial-gradient(circle at 35% 35%, #ffffff, #dcdcdc 70%, #999);
            border: 1px solid #bbb;
        }

        .player-meta .name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .player-meta .captures {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .game-status-center {
            text-align: center;
        }

        .status-msg {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-gold);
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* Board Container */
        .board-container {
            position: relative;
            background: #111;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            border-radius: 8px;
            cursor: pointer;
            touch-action: none;
        }

        /* Control Action Buttons */
        .controls {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: var(--panel-bg);
            color: var(--text-light);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 9px 16px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: #36332f;
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        button:active {
            transform: scale(0.97);
        }

        button.btn-primary {
            background: #9d3a28;
            border-color: #c74b35;
            color: #fff;
        }
        button.btn-primary:hover {
            background: #bd452f;
        }

        select {
            background: var(--panel-bg);
            color: var(--text-light);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #2a2724;
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 28px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0,0,0,0.6);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-card h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--accent-gold);
        }

        .score-table {
            width: 100%;
            margin: 18px 0;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .score-table th, .score-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .score-table th {
            color: var(--text-dim);
            font-weight: 500;
        }

        .score-table tr.total {
            font-weight: 800;
            font-size: 1.05rem;
            color: #fff;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
            .dashboard {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .game-status-center {
                grid-column: span 2;
                order: -1;
            }
            .controls {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- 헤더 -->
    <header>
        <div class="title-group">
            <h1>AI 바둑 마스터 <span>碁 / Baduk</span></h1>

<script>
/**
 * Zero-Dependency Baduk Game Engine with Procedural Graphics & Web Audio Synthesis
 */

// --- 1. Web Audio API 사운드 합성기 ---
class SoundFX {
    constructor() {
        this.ctx = null;
    }

    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    // 바둑알 놓는 타격음 ("딱!")
    playPlaceStone() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;

        // 원목 바둑판 울림 (저주파 Sine)
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);

        oscGain.gain.setValueAtTime(0.7, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(oscGain);
        oscGain.connect(this.ctx.destination);

        // 돌 마찰 순간 틱(High-pitch Click) 사운드
        const snap = this.ctx.createOscillator();
        const snapGain = this.ctx.createGain();
        snap.type = 'sine';
        snap.frequency.setValueAtTime(1600, now);
        snap.frequency.exponentialRampToValueAtTime(400, now + 0.02);

        snapGain.gain.setValueAtTime(0.4, now);
        snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

        snap.connect(snapGain);
        snapGain.connect(this.ctx.destination);

        osc.start(now);
        snap.start(now);
        osc.stop(now + 0.09);
        snap.stop(now + 0.03);
    }

    // 사석 따낼 때 경쾌한 맑은 화음
    playCapture() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.2, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.25);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.28);
        });
    }

    // 패스 및 기권 알림음
    playNotify() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(330, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
    }
}

// --- 2. 바둑 룰 및 상태 엔진 ---
const EMPTY = 0;
const BLACK = 1; // 플레이어
const WHITE = 2; // 컴퓨터 AI

class BadukGame {
    constructor(size = 9) {
        this.size = size;
        this.reset();
    }

    reset(size = this.size) {
        this.size = parseInt(size, 10);
        this.board = Array(this.size * this.size).fill(EMPTY);
        this.turn = BLACK; // 흑 선공
        this.captures = { [BLACK]: 0, [WHITE]: 0 };
        this.koCoord = -1; // 패(Ko) 금지 좌표
        this.lastMove = -1;
        this.passCount = 0;
        this.isGameOver = false;
        this.history = []; // 기보 기록
    }

    idx(r, c) {
        return r * this.size + c;
    }

    rc(index) {
        return { r: Math.floor(index / this.size), c: index % this.size };
    }

    isValidCoord(r, c) {
        return r >= 0 && r < this.size && c >= 0 && c < this.size;
    }

    getAdjacent(index) {
        const { r, c } = this.rc(index);
        const neighbors = [];
        const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        for (const [dr, dc] of dirs) {
            const nr = r + dr, nc = c + dc;
            if (this.isValidCoord(nr, nc)) {
                neighbors.push(this.idx(nr, nc));
            }
        }
        return neighbors;
    }

    // 연결된 돌 덩어리(Group) 및 활로(Liberties) 계산 (BFS)
    getGroupInfo(startIndex, board = this.board) {
        const color = board[startIndex];
        if (color === EMPTY) return { group: [], liberties: new Set() };

        const visited = new Set([startIndex]);
        const queue = [startIndex];
        const group = [];
        const liberties = new Set();

        while (queue.length > 0) {
            const curr = queue.shift();
            group.push(curr);

            for (const neighbor of this.getAdjacent(curr)) {
                const nColor = board[neighbor];
                if (nColor === EMPTY) {
                    liberties.add(neighbor);
                } else if (nColor === color && !visited.has(neighbor)) {
                    visited.add(neighbor);
                    queue.push(neighbor);
                }
            }
        }
        return { group, liberties };
    }

    // 착수 유효성 검증 및 가상 착수 결과 산출
    evaluateMove(index, color, board = this.board, koCoord = this.koCoord) {
        if (board[index] !== EMPTY) return { valid: false, reason: "이미 돌이 존재합니다." };
        if (index === koCoord) return { valid: false, reason: "패(Ko) 규칙으로 즉시 다시 둘 수 없습니다." };

        const opponent = color === BLACK ? WHITE : BLACK;
        const testBoard = [...board];
        testBoard[index] = color;

        // 1. 인접한 상대 돌 중 활로가 0이 되어 잡히는 그룹 탐색
        let capturedStones = [];
        const neighbors = this.getAdjacent(index);
        const visitedEnemyGroups = new Set();

        for (const n of neighbors) {
            if (testBoard[n] === opponent && !visitedEnemyGroups.has(n)) {
                const enemyInfo = this.getGroupInfo(n, testBoard);
                enemyInfo.group.forEach(gIdx => visitedEnemyGroups.add(gIdx));
                if (enemyInfo.liberties.size === 0) {
                    capturedStones.push(...enemyInfo.group);
                }
            }
        }

        // 상대 돌을 잡았을 때 해당 돌들을 임시 제거
        for (const cap of capturedStones) {
            testBoard[cap] = EMPTY;
        }

        // 2. 자신이 활로를 확보하고 있는지(자충수 여부 검사)
        const myInfo = this.getGroupInfo(index, testBoard);
        if (myInfo.liberties.size === 0) {
            return { valid: false, reason: "자충수(활로가 없는 자리)는 착수할 수 없습니다." };
        }

        // 3. 패(Ko) 상태 판별: 한 개를 놓아 딱 상대 한 개를 잡았고, 내 돌도 활로가 1개인 경우
        let newKoCoord = -1;
        if (capturedStones.length === 1 && myInfo.group.length === 1 && myInfo.liberties.size === 1) {
            newKoCoord = capturedStones[0];
        }

        return {
            valid: true,
            capturedStones,
            newKoCoord,
            resultingBoard: testBoard
        };
    }

    // 실제 착수 수행
    play(index) {
        if (this.isGameOver) return { success: false, msg: "대국이 이미 종료되었습니다." };

        const result = this.evaluateMove(index, this.turn);
        if (!result.valid) {
            return { success: false, msg: result.reason };
        }

        // 상태 적용
        this.board = result.resultingBoard;
        this.captures[this.turn] += result.capturedStones.length;
        this.koCoord = result.newKoCoord;
        this.lastMove = index;
        this.passCount = 0;

        this.history.push({
            color: this.turn,
            move: index,
            captured: result.capturedStones
        });

        // 턴 전환
        this.turn = (this.turn === BLACK) ? WHITE : BLACK;
        return { success: true, captured: result.capturedStones };
    }

    pass() {
        if (this.isGameOver) return false;
        this.passCount++;
        this.lastMove = -1;
        this.koCoord = -1;
        this.turn = (this.turn === BLACK) ? WHITE : BLACK;

        if (this.passCount >= 2) {
            this.isGameOver = true;
            return true; // 게임 종료
        }
        return false;
    }

    // 간이 계가(집 계산) 엔진 (Flood Fill 영토 판정)
    calculateTerritory() {
        const visited = new Set();
        let blackTerritory = 0;
        let whiteTerritory = 0;

        for (let i = 0; i < this.board.length; i++) {
            if (this.board[i] === EMPTY && !visited.has(i)) {
                const emptyGroup = [];
                const adjacentColors = new Set();
                const queue = [i];
                visited.add(i);

                while (queue.length > 0) {
                    const curr = queue.shift();
                    emptyGroup.push(curr);

                    for (const n of this.getAdjacent(curr)) {
                        const color = this.board[n];
                        if (color === EMPTY) {
                            if (!visited.has(n)) {
                                visited.add(n);
                                queue.push(n);
                            }
                        } else {
                            adjacentColors.add(color);
                        }
                    }
                }

                // 공백 영역이 오직 한 색의 돌에만 둘러싸여 있을 때 해당 플레이어의 집으로 계산
                if (adjacentColors.size === 1) {
                    if (adjacentColors.has(BLACK)) {
                        blackTerritory += emptyGroup.length;
                    } else if (adjacentColors.has(WHITE)) {
                        whiteTerritory += emptyGroup.length;
                    }
                }
            }
        }

        return {
            blackTerritory,
            whiteTerritory,
            blackCaptures: this.captures[BLACK],
            whiteCaptures: this.captures[WHITE],
            komi: 6.5,
            blackTotal: blackTerritory + this.captures[BLACK],
            whiteTotal: whiteTerritory + this.captures[WHITE] + 6.5
        };
    }
}

// --- 3. 경량 휴리스틱 AI 대국 엔진 ---
class BadukAI {
    static getBestMove(game) {
        const aiColor = WHITE;
        const playerColor = BLACK;
        const candidateMoves = [];

        // 화점(Star points) 및 주요 거점 좌표 우선도 보정
        const center = (game.size - 1) / 2;

        for (let i = 0; i < game.board.length; i++) {
            if (game.board[i] !== EMPTY) continue;

            const sim = game.evaluateMove(i, aiColor);
            if (!sim.valid) continue;

            let score = 0;
            const { r, c } = game.rc(i);

            // 1. 단수 상태인 상대방 돌 잡기 (최우선 가치)
            if (sim.capturedStones.length > 0) {
                score += 120 + (sim.capturedStones.length * 35);
            }

            // 2. 내 돌이 단수(Liberties 1)가 되는 위험 회피
            const myGroup = game.getGroupInfo(i, sim.resultingBoard);
            if (myGroup.liberties.size === 1) {
                // 자살골성 착수 방지 (극단적 감점)
                score -= 90;
            } else if (myGroup.liberties.size >= 3) {
                score += 15;
            }

            // 3. 상대가 착수하면 큰 이득을 보는 자리(선수 차단) 탐색
            const playerSim = game.evaluateMove(i, playerColor);
            if (playerSim.valid && playerSim.capturedStones.length > 0) {
                score += 85 + (playerSim.capturedStones.length * 25);
            }

            // 4. 기존 돌들과의 근접성 및 호응도 (고립된 허수 방지)
            const neighbors = game.getAdjacent(i);
            let friendNeighbors = 0;
            let enemyNeighbors = 0;
            for (const n of neighbors) {
                if (game.board[n] === aiColor) friendNeighbors++;
                if (game.board[n] === playerColor) enemyNeighbors++;
            }
            score += friendNeighbors * 6;
            score += enemyNeighbors * 4;

            // 5. 1선(바둑판 가장자리) 기권성 착수 감점 (초반 감점)
            const isBorder = (r === 0 || r === game.size - 1 || c === 0 || c === game.size - 1);
            if (isBorder && game.history.length < game.size * 2) {
                score -= 18;
            }

            // 6. 중앙 및 3~4선 거점 선호
            const distFromCenter = Math.abs(r - center) + Math.abs(c - center);
            score -= distFromCenter * 1.5;

            // 약간의 무작위성을 부여하여 매번 똑같은 패턴을 두지 않도록 유도
            score += Math.random() * 4;

            candidateMoves.push({ index: i, score });
        }

        if (candidateMoves.length === 0) return -1; // 둘 곳이 없으면 패스

        // 점수 기준 내림차순 정렬
        candidateMoves.sort((a, b) => b.score - a.score);
        return candidateMoves[0].score < -30 ? -1 : candidateMoves[0].index;
    }
}

// --- 4. 그래픽 렌더러 및 UI 통합 컨트롤러 ---
class BadukApp {
    constructor() {
        this.canvas = document.getElementById('badukCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.sound = new SoundFX();
        this.game = new BadukGame(9);

        // 시각 효과용 파티클
        this.particles = [];
        this.hoverCoord = null;

        // UI 요소 캐싱
        this.elGameStatus = document.getElementById('gameStatus');
        this.elBlackCaptures = document.getElementById('blackCaptures');
        this.elWhiteCaptures = document.getElementById('whiteCaptures');
        this.elPCardBlack = document.getElementById('pCardBlack');
        this.elPCardWhite = document.getElementById('pCardWhite');
        this.elBoardSizeSelect = document.getElementById('boardSizeSelect');
        this.elResultModal = document.getElementById('resultModal');
        this.elWinCount = document.getElementById('winCount');
        this.elLossCount = document.getElementById('lossCount');

        // 전적 로드
        this.stats = JSON.parse(localStorage.getItem('baduk_master_stats') || '{"win": 0, "loss": 0}');
        this.updateStatsUI();

        // 캔버스 크기 맞춤 & 이벤트 바인딩
        this.initCanvasSize();
        this.bindEvents();

        // 애니메이션 루프 시작
        this.lastFrameTime = performance.now();
        requestAnimationFrame((t) => this.renderLoop(t));
    }

    initCanvasSize() {
        const dpr = window.devicePixelRatio || 1;
        const containerWidth = Math.min(window.innerWidth - 40, 560);
        this.displaySize = Math.max(300, containerWidth);

        this.canvas.style.width = `${this.displaySize}px`;
        this.canvas.style.height = `${this.displaySize}px`;
        this.canvas.width = Math.floor(this.displaySize * dpr);
        this.canvas.height = Math.floor(this.displaySize * dpr);

        this.ctx.scale(dpr, dpr);
    }

    bindEvents() {
        window.addEventListener('resize', () => this.initCanvasSize());

        // 마우스 및 터치 착수
        const handleInput = (clientX, clientY) => {
            if (this.game.turn !== BLACK || this.game.isGameOver) return;
            const rect = this.canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            const coord = this.getIntersectionFromCoord(x, y);
            if (coord !== null) {
                this.executePlayerMove(coord);
            }
        };

        this.canvas.addEventListener('mousemove', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            this.hoverCoord = this.getIntersectionFromCoord(x, y);
        });

        this.canvas.addEventListener('mouseleave', () => {
            this.hoverCoord = null;
        });

        this.canvas.addEventListener('click', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        this.canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleInput(touch.clientX, touch.clientY);
        }, { passive: true });

        // 버튼 조작
        document.getElementById('btnPass').addEventListener('click', () => {
            if (this.game.isGameOver || this.game.turn !== BLACK) return;
            this.sound.playNotify();
            const ended = this.game.pass();
            if (ended) {
                this.endGameByPass();
            } else {
                this.updateUI();
                this.triggerAiTurn();
            }
        });

        document.getElementById('btnResign').addEventListener('click', () => {
            if (this.game.isGameOver) return;
            if (confirm("정말 기권하시겠습니까? (백의 불계승)")) {
                this.finishGame(WHITE, true);
            }
        });

        document.getElementById('btnNewGame').addEventListener('click', () => {
            this.startNewGame();
        });

        this.elBoardSizeSelect.addEventListener('change', (e) => {
            this.game.reset(e.target.value);
            this.updateUI();
        });

        document.getElementById('modalBtnRestart').addEventListener('click', () => {
            this.elResultModal.classList.remove('active');
            this.startNewGame();
        });

        document.getElementById('modalBtnClose').addEventListener('click', () => {
            this.elResultModal.classList.remove('active');
        });
    }

    startNewGame() {
        const size = this.elBoardSizeSelect.value;
        this.game.reset(size);
        this.particles = [];
        this.hoverCoord = null;
        this.elResultModal.classList.remove('active');
        this.updateUI();
        this.elGameStatus.textContent = "흑의 차례 (착수하세요)";
    }

    getIntersectionFromCoord(x, y) {
        const size = this.game.size;
        const padding = this.displaySize * 0.08;
        const gridStep = (this.displaySize - padding * 2) / (size - 1);

        const col = Math.round((x - padding) / gridStep);
        const row = Math.round((y - padding) / gridStep);

        if (row >= 0 && row < size && col >= 0 && col < size) {
            const centerX = padding + col * gridStep;
            const centerY = padding + row * gridStep;
            const dist = Math.hypot(x - centerX, y - centerY);
            if (dist < gridStep * 0.45) {
                return this.game.idx(row, col);
            }
        }
        return null;
    }

    executePlayerMove(coord) {
        const result = this.game.play(coord);
        if (!result.success) {
            this.showToast(result.msg);
            return;
        }

        this.sound.playPlaceStone();
        this.spawnPlaceParticles(coord, BLACK);

        if (result.captured.length > 0) {
            this.sound.playCapture();
            result.captured.forEach(c => this.spawnCaptureParticles(c));
        }

        this.updateUI();

        // 컴퓨터 AI 응수 호출
        this.triggerAiTurn();
    }

    triggerAiTurn() {
        if (this.game.isGameOver) return;

        this.elGameStatus.textContent = "인공지능 생각 중...";
        this.elPCardBlack.classList.remove('active');
        this.elPCardWhite.classList.add('active');

        setTimeout(() => {
            if (this.game.isGameOver) return;

            const aiMove = BadukAI.getBestMove(this.game);
            if (aiMove === -1) {
                // AI 패스 선언
                this.sound.playNotify();
                const ended = this.game.pass();
                this.showToast("인공지능이 착수를 통과(Pass)했습니다.");
                if (ended) {
                    this.endGameByPass();
                } else {
                    this.updateUI();
                }
            } else {
                const aiResult = this.game.play(aiMove);
                if (aiResult.success) {
                    this.sound.playPlaceStone();
                    this.spawnPlaceParticles(aiMove, WHITE);
                    if (aiResult.captured.length > 0) {
                        this.sound.playCapture();
                        aiResult.captured.forEach(c => this.spawnCaptureParticles(c));
                    }
                }
                this.updateUI();
            }
        }, 320);
    }

    endGameByPass() {
        this.game.isGameOver = true;
        const res = this.game.calculateTerritory();
        const winner = res.blackTotal > res.whiteTotal ? BLACK : WHITE;
        this.showResultModal(winner, res, false);
    }

    finishGame(winner, isResign = false) {
        this.game.isGameOver = true;
        const res = this.game.calculateTerritory();
        this.showResultModal(winner, res, isResign);
    }

    showResultModal(winner, scoreData, isResign) {
        const isWin = winner === BLACK;
        if (isWin) {
            this.stats.win++;
        } else {
            this.stats.loss++;
        }
        localStorage.setItem('baduk_master_stats', JSON.stringify(this.stats));
        this.updateStatsUI();

        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');

        if (isResign) {
            modalTitle.textContent = winner === BLACK ? "흑 불계승! (승리)" : "백 불계승! (패배)";
            modalTitle.style.color = winner === BLACK ? "#4ade80" : "#ef4444";
            modalDesc.textContent = "기권으로 대국이 종료되었습니다.";
        } else {
            const diff = Math.abs(scoreData.blackTotal - scoreData.whiteTotal).toFixed(1);
            modalTitle.textContent = winner === BLACK ? `흑 ${diff}집반 승! (승리)` : `백 ${diff}집반 승! (패배)`;
            modalTitle.style.color = winner === BLACK ? "#4ade80" : "#ef4444";
            modalDesc.textContent = "양 대국자 연속 패스로 계가가 완료되었습니다.";
        }

        document.getElementById('bTerritory').textContent = scoreData.blackTerritory;
        document.getElementById('wTerritory').textContent = scoreData.whiteTerritory;
        document.getElementById('bStones').textContent = scoreData.blackCaptures;
        document.getElementById('wStones').textContent = scoreData.whiteCaptures;
        document.getElementById('bTotal').textContent = scoreData.blackTotal.toFixed(1);
        document.getElementById('wTotal').textContent = scoreData.whiteTotal.toFixed(1);

        this.elResultModal.classList.add('active');
        this.updateUI();
    }

    updateUI() {
        this.elBlackCaptures.textContent = this.game.captures[BLACK];
        this.elWhiteCaptures.textContent = this.game.captures[WHITE];

        if (!this.game.isGameOver) {
            if (this.game.turn === BLACK) {
                this.elPCardBlack.classList.add('active');
                this.elPCardWhite.classList.remove('active');
                this.elGameStatus.textContent = "흑의 차례 (착수하세요)";
            } else {
                this.elPCardBlack.classList.remove('active');
                this.elPCardWhite.classList.add('active');
                this.elGameStatus.textContent = "인공지능 계산 중...";
            }
        } else {
            this.elPCardBlack.classList.remove('active');
            this.elPCardWhite.classList.remove('active');
            this.elGameStatus.textContent = "대국 종료";
        }
    }

    updateStatsUI() {
        this.elWinCount.textContent = this.stats.win;
        this.elLossCount.textContent = this.stats.loss;
    }

    showToast(msg) {
        this.elGameStatus.textContent = msg;
        setTimeout(() => {
            if (!this.game.isGameOver) {
                this.elGameStatus.textContent = this.game.turn === BLACK ? "흑의 차례 (착수하세요)" : "인공지능 계산 중...";
            }
        }, 1600);
    }

    spawnPlaceParticles(coord, color) {
        const { x, y } = this.getXYFromIndex(coord);
        for (let i = 0; i < 14; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.2 + Math.random() * 2.5;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                decay: 0.04 + Math.random() * 0.03,
                size: 2.5 + Math.random() * 2.5,
                color: color === BLACK ? 'rgba(230, 200, 140,' : 'rgba(255, 255, 255,'
            });
        }
    }

    spawnCaptureParticles(coord) {
        const { x, y } = this.getXYFromIndex(coord);
        for (let i = 0; i < 20; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 3.5;
            this.particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                alpha: 1,
                decay: 0.025 + Math.random() * 0.03,
                size: 3 + Math.random() * 3,
                color: 'rgba(240, 90, 70,'
            });
        }
    }

    getXYFromIndex(index) {
        const size = this.game.size;
        const padding = this.displaySize * 0.08;
        const gridStep = (this.displaySize - padding * 2) / (size - 1);
        const { r, c } = this.game.rc(index);
        return {
            x: padding + c * gridStep,
            y: padding + r * gridStep
        };
    }

    // --- 5. 실시간 렌더링 파이프라인 ---
    renderLoop(currentTime) {
        const dt = (currentTime - this.lastFrameTime) / 1000;
        this.lastFrameTime = currentTime;

        this.renderBoard();
        this.renderParticles(dt);

        requestAnimationFrame((t) => this.renderLoop(t));
    }

    renderBoard() {
        const ctx = this.ctx;
        const size = this.game.size;
        const w = this.displaySize;
        const padding = w * 0.08;
        const gridStep = (w - padding * 2) / (size - 1);
        const stoneRadius = gridStep * 0.46;

        ctx.clearRect(0, 0, w, w);

        // 1. 최고급 원목 바둑판 (Kaya wood grain 질감 절차적 드로잉)
        const woodGrad = ctx.createLinearGradient(0, 0, w, w);
        woodGrad.addColorStop(0, '#e8b877');
        woodGrad.addColorStop(0.5, '#dcab68');
        woodGrad.addColorStop(1, '#cb9956');
        ctx.fillStyle = woodGrad;
        ctx.fillRect(0, 0, w, w);

        // 미세 원목 나뭇결 효과
        ctx.save();
        ctx.globalAlpha = 0.05;
        ctx.strokeStyle = '#4a2500';
        ctx.lineWidth = 1;
        for (let y = 0; y < w; y += 4) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.bezierCurveTo(w * 0.3, y + Math.sin(y * 0.05) * 6, w * 0.7, y - Math.cos(y * 0.05) * 6, w, y);
            ctx.stroke();
        }
        ctx.restore();

        // 2. 바둑판 외곽 테두리 및 격자선 그리기
        ctx.strokeStyle = '#3e2612';
        ctx.lineWidth = 1.2;

        for (let i = 0; i < size; i++) {
            const pos = padding + i * gridStep;

            // 가로줄
            ctx.beginPath();
            ctx.moveTo(padding, pos);
            ctx.lineTo(w - padding, pos);
            ctx.stroke();

            // 세로줄
            ctx.beginPath();
            ctx.moveTo(pos, padding);
            ctx.lineTo(pos, w - padding);
            ctx.stroke();
        }

        // 3. 화점(Hoshi) 렌더링
        const starPoints = this.getStarPoints(size);
        ctx.fillStyle = '#3e2612';
        for (const [sr, sc] of starPoints) {
            const px = padding + sc * gridStep;
            const py = padding + sr * gridStep;
            ctx.beginPath();
            ctx.arc(px, py, Math.max(2.5, gridStep * 0.075), 0, Math.PI * 2);
            ctx.fill();
        }

        // 4. 착수 가이드(마우스 호버 미리보기)
        if (this.hoverCoord !== null && this.game.turn === BLACK && !this.game.isGameOver) {
            if (this.game.board[this.hoverCoord] === EMPTY) {
                const { x, y } = this.getXYFromIndex(this.hoverCoord);
                ctx.save();
                ctx.globalAlpha = 0.45;
                ctx.beginPath();
                ctx.arc(x, y, stoneRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#222';
                ctx.fill();
                ctx.restore();
            }
        }

        // 5. 바둑돌 입체 렌더링 (자연광 입체감)
        for (let idx = 0; idx < this.game.board.length; idx++) {
            const stone = this.game.board[idx];
            if (stone === EMPTY) continue;

            const { x, y } = this.getXYFromIndex(idx);

            // 돌 그림자 (Drop Shadow)
            ctx.save();
            ctx.beginPath();
            ctx.arc(x + 2, y + 3, stoneRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.filter = 'blur(2px)';
            ctx.fill();
            ctx.restore();

            // 바둑돌 몸체 (흑돌: 먹빛 입체 구형 / 백돌: 무결 조개껍질 광택)
            ctx.beginPath();
            ctx.arc(x, y, stoneRadius, 0, Math.PI * 2);

            if (stone === BLACK) {
                const grad = ctx.createRadialGradient(
                    x - stoneRadius * 0.35, y - stoneRadius * 0.35, stoneRadius * 0.1,
                    x, y, stoneRadius
                );
                grad.addColorStop(0, '#555555');
                grad.addColorStop(0.6, '#181818');
                grad.addColorStop(1, '#050505');
                ctx.fillStyle = grad;
                ctx.fill();

                // 미세 테두리 윤곽
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = 1;
                ctx.stroke();
            } else {
                const grad = ctx.createRadialGradient(
                    x - stoneRadius * 0.35, y - stoneRadius * 0.35, stoneRadius * 0.1,
                    x, y, stoneRadius
                );
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.75, '#e4e4e4');
                grad.addColorStop(1, '#b0b0b0');
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // 마지막 착수 표시 (적갈색/금색 포인트 링)
            if (idx === this.game.lastMove) {
                ctx.beginPath();
                ctx.arc(x, y, stoneRadius * 0.35, 0, Math.PI * 2);
                ctx.strokeStyle = stone === BLACK ? '#f59e0b' : '#dc2626';
                ctx.lineWidth = 2.4;
                ctx.stroke();
            }
        }
    }

    renderParticles(dt) {
        const ctx = this.ctx;
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.alpha -= p.decay;

            if (p.alpha <= 0) {
                this.particles.splice(i, 1);
                continue;
            }

            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = `${p.color}${p.alpha})`;
            ctx.fill();
            ctx.restore();
        }
    }

    getStarPoints(size) {
        if (size === 9) {
            return [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]];
        } else if (size === 13) {
            return [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]];
        } else if (size === 19) {
            return [
                [3, 3], [3, 9], [3, 15],
                [9, 3], [9, 9], [9, 15],
                [15, 3], [15, 9], [15, 15]
            ];
        }
        return [];
    }
}
